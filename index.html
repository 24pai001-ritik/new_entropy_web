<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entropy AI | Chaos to Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4FD1FF;
            --secondary: #3B6DFF;
            --accent: #8B5CF6;
            --bg: #030507;
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(255, 255, 255, 0.02);
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: #FFFFFF;
            overflow-x: hidden;
            scroll-behavior: smooth;
            cursor: none;
        }
        h1, h2, h3, h4 {
            font-family: 'Outfit', sans-serif;
        }
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .glass:hover {
            border: 1px solid rgba(79, 209, 255, 0.3);
            background: rgba(255, 255, 255, 0.04);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .text-gradient {
            background: linear-gradient(135deg, #4FD1FF 0%, #8B5CF6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .custom-cursor {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            mix-blend-mode: difference;
            will-change: transform;
        }
        .cursor-ring {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(79, 209, 255, 0.4);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            will-change: transform;
            transition: width 0.3s ease, height 0.3s ease, background 0.3s ease;
        }

        .grid-bg {
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.05) 1px, transparent 0);
            background-size: 40px 40px;
            z-index: -30;
            mask-image: radial-gradient(circle at center, black, transparent 80%);
        }

        .glow-bloom {
            box-shadow: 0 0 80px -20px var(--primary);
        }

        ::selection {
            background: var(--primary);
            color: black;
        }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="scrollbar-hide">
    <div class="noise-overlay"></div>
    <div class="grid-bg"></div>
    <div id="cursor" class="custom-cursor"></div>
    <div id="cursor-ring" class="cursor-ring"></div>
    <div id="root"></div>
    <script>
        const cursor = document.getElementById('cursor');
        const ring = document.getElementById('cursor-ring');
        let mouseX = 0, mouseY = 0;
        let ringX = 0, ringY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursor.style.transform = `translate3d(${mouseX - 4}px, ${mouseY - 4}px, 0)`;
        });

        function animateRing() {
            ringX += (mouseX - ringX) * 0.15;
            ringY += (mouseY - ringY) * 0.15;
            ring.style.transform = `translate3d(${ringX - 20}px, ${ringY - 20}px, 0)`;
            requestAnimationFrame(animateRing);
        }
        animateRing();

        document.addEventListener('mousedown', () => {
            ring.style.width = '30px';
            ring.style.height = '30px';
            ring.style.background = 'rgba(79, 209, 255, 0.2)';
        });
        document.addEventListener('mouseup', () => {
            ring.style.width = '40px';
            ring.style.height = '40px';
            ring.style.background = 'transparent';
        });
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
